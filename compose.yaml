services:
  game:
    build: .
    image: leftnt:local
    ports:
      - "${LEFTNT_BIND_ADDRESS:-127.0.0.1}:${LEFTNT_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      STATIC_DIR: /app/public
      WEBRTC_ICE_SERVERS: "${WEBRTC_ICE_SERVERS:-[]}"
    read_only: true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 10s
